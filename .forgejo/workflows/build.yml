name: Build & Push Custom Docker Image
on:
  push:
    branches:
      - dev
  workflow_dispatch:
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true
env:
  IMAGE: git-forgejo.k-lab.lan:3000/timkjr/paperless-custom
jobs:
  build-and-push:
    name: Build & Push
    runs-on: docker-builder
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to Forgejo registry
        run: echo "${{ github.token }}" | docker login git-forgejo.k-lab.lan:3000 -u timkjr --password-stdin
      - name: Build and push
        run: |
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          DATE=$(date +%Y%m%d)
          SHA=$(echo "${{ github.sha }}" | cut -c1-8)

          docker build \
            --tag "${{ env.IMAGE }}:custom-fix" \
            --tag "${{ env.IMAGE }}:dev" \
            --tag "${{ env.IMAGE }}:dev-${DATE}-${SHA}" \
            .

          docker push "${{ env.IMAGE }}:custom-fix"
          docker push "${{ env.IMAGE }}:dev"
          docker push "${{ env.IMAGE }}:dev-${DATE}-${SHA}"
