name: Build & Push Custom Docker Image
on:
  push:
    branches:
      - dev
  workflow_dispatch:
concurrency:
  group: docker-build-${{ gitea.ref }}
  cancel-in-progress: true
env:
  REGISTRY: git-forgejo.k-lab.lan:3000
  IMAGE: git-forgejo.k-lab.lan:3000/timkjr/paperless-custom
jobs:
  build-and-push:
    name: Build & Push
    runs-on: debian13-lxc-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Forgejo Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ gitea.actor }}
          password: ${{ gitea.token }}
      - name: Generate image tags
        id: tags
        run: |
          DATE=$(date +%Y%m%d)
          SHA=$(echo "${{ gitea.sha }}" | cut -c1-8)
          echo "tags=${{ env.IMAGE }}:custom-fix,${{ env.IMAGE }}:dev,${{ env.IMAGE }}:dev-${DATE}-${SHA}" >> $GITHUB_OUTPUT
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:dev
          cache-to: type=inline
